const CATEGORIES = [
  { id: "weight-loss", label: "Weight Loss & Metabolic", icon: "⚡" },
  { id: "gh", label: "Growth Hormone & IGF", icon: "📈" },
  { id: "recovery", label: "Recovery & Repair", icon: "🔧" },
  { id: "cognitive", label: "Cognitive & Neurological", icon: "🧠" },
  { id: "immune", label: "Immune & Anti-Ageing", icon: "🛡️" },
  { id: "sexual", label: "Sexual Health & Hormonal", icon: "❤️" },
  { id: "skin", label: "Skin, Beauty & Collagen", icon: "✨" },
  { id: "accessories", label: "Accessories & Support", icon: "🧪" },
];

const WHATSAPP_NUMBER = "447903025733";
const PIN = "1234";

function App() {
  const [avail, setAvail] = useState(() => Object.fromEntries(PRODUCTS.map(p => [p.id, "in_stock"])));
  const [sizes, setSizes] = useState(() => Object.fromEntries(PRODUCTS.map(p => [p.id, p.sizes[0]])));
  const [basket, setBasket] = useState([]);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [adminOpen, setAdminOpen] = useState(false);
  const [pin, setPin] = useState("");
  const [unlocked, setUnlocked] = useState(false);

  const addToBasket = (p) => {
    const size = sizes[p.id];
    const key = p.id + "_" + size;
    setBasket(prev => {
      const ex = prev.find(i => i.key === key);
      if (ex) return prev.map(i => i.key === key ? {...i, qty: i.qty+1} : i);
      return [...prev, {key, id:p.id, name:p.name, size, avail:avail[p.id], noVial:p.noVial, qty:1}];
    });
  };

  const removeItem = (key) => setBasket(prev => prev.filter(i => i.key !== key));
  const updateQty = (key, d) => setBasket(prev => prev.map(i => i.key === key ? {...i, qty:Math.max(1,i.qty+d)} : i));
  const totalItems = basket.reduce((s,i) => s+i.qty, 0);

  const sendWhatsApp = () => {
    const lines = basket.map(i => `• ${i.name} — ${i.size}${!i.noVial?" / vial":""} x${i.qty} (${i.avail==="in_stock"?"In Stock":"To Order"})`);
    const msg = ["🧪 *KB Peptides Order*","", ...lines, "", `*Total items: ${totalItems}*`].join("
");
    window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg), "_blank");
  };

  const c = {
    bg:"#0a0a0a", card:"#111820", border:"#1c2a3a", borderOn:"#1a6fd4",
    blue:"#1a8aff", blueDark:"#1a6fd4", text:"#e8edf2", muted:"#9aaab8", dim:"#607080",
    green:"#00c46a", amber:"#ffaa00",
  };

  const availBadge = (a) => ({
    alignSelf:"flex-start", padding:"2px 8px", borderRadius:"3px",
    fontSize:"9px", fontWeight:"700", letterSpacing:"0.5px", textTransform:"uppercase",
    background: a==="in_stock"?"rgba(0,180,100,0.15)":"rgba(255,160,0,0.12)",
    color: a==="in_stock"?c.green:c.amber,
    border: a==="in_stock"?"1px solid rgba(0,180,100,0.3)":"1px solid rgba(255,160,0,0.3)",
  });

  return (
    <div style={{minHeight:"100vh", background:c.bg, color:c.text, fontFamily:"Arial,sans-serif"}}>

      {/* Header */}
      <div style={{background:"#000", borderBottom:"1px solid #1a3a6a", paddingBottom:"10px"}}>
        <img src={LOGO} alt="KB Peptides" style={{display:"block", margin:"0 auto", width:"240px"}} />
        <div style={{textAlign:"center", fontSize:"10px", color:c.dim, letterSpacing:"3px", textTransform:"uppercase"}}>Product Order Form</div>
      </div>

      {/* Disclaimer */}
      <div style={{background:"#0d1520", borderBottom:"1px solid #1a3a6a", padding:"9px 16px", textAlign:"center", fontSize:"11px", color:"#8aabcc", fontStyle:"italic"}}>
        ⚠️ <strong style={{color:c.blue}}>Please Note:</strong> All products are for <strong style={{color:c.text}}>research purposes only</strong> and are not intended for human consumption.
      </div>

      {/* Delivery banner */}
      <div style={{background:"#0a1020", borderBottom:"1px solid #1a3a6a", padding:"8px 16px", display:"flex", justifyContent:"center", gap:"24px", flexWrap:"wrap"}}>
        <span style={{fontSize:"11px", color:c.green}}>🚚 <strong>In Stock:</strong> Delivery 1–3 days</span>
        <span style={{fontSize:"11px", color:c.amber}}>⏱ <strong>To Order:</strong> Up to 14 days to arrive</span>
      </div>

      {/* Products */}
      <div style={{maxWidth:"960px", margin:"0 auto", padding:"24px 16px 120px"}}>
        {CATEGORIES.map(cat => {
          const products = PRODUCTS.filter(p => p.category===cat.id);
          return (
            <div key={cat.id} style={{marginBottom:"32px"}}>
              <div style={{display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px", paddingBottom:"10px", borderBottom:"1px solid #1a3a6a"}}>
                <span style={{fontSize:"18px"}}>{cat.icon}</span>
                <h2 style={{margin:0, fontSize:"12px", fontWeight:"700", letterSpacing:"3px", textTransform:"uppercase", color:c.blue}}>{cat.label}</h2>
                <div style={{flex:1, height:"1px", background:"linear-gradient(to right,#1a3a6a,transparent)"}} />
              </div>
              <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))", gap:"10px"}}>
                {products.map(p => {
                  const a = avail[p.id];
                  const inB = basket.some(i => i.id===p.id);
                  return (
                    <div key={p.id} style={{background:inB?"linear-gradient(135deg,#0d2a5a,#0a1e3f)":c.card, border:`1px solid ${inB?c.borderOn:c.border}`, borderRadius:"8px", padding:"12px", display:"flex", flexDirection:"column", gap:"5px"}}>
                      <div style={{fontSize:"12px", color:inB?c.text:c.muted, fontWeight:"700", lineHeight:"1.3"}}>{p.name}</div>
                      {p.sizes.length > 1 ? (
                        <select value={sizes[p.id]} onChange={e => setSizes(prev=>({...prev,[p.id]:e.target.value}))}
                          style={{background:"#0a0f18", border:"1px solid #1a3a6a", borderRadius:"4px", color:c.blue, fontSize:"11px", fontWeight:"700", padding:"4px 6px", cursor:"pointer", outline:"none"}}>
                          {p.sizes.map(s => <option key={s} value={s}>{s}{!p.noVial?" / vial":""}</option>)}
                        </select>
                      ) : (
                        <div style={{fontSize:"11px", color:c.blueDark, fontWeight:"700"}}>
                          {p.sizes[0]}{!p.noVial && <span style={{fontWeight:400, color:"#2a4060", fontSize:"10px"}}> / vial</span>}
                        </div>
                      )}
                      <div style={availBadge(a)}>{a==="in_stock"?"✦ In Stock":"⏱ To Order"}</div>
                      <button onClick={()=>addToBasket(p)} style={{marginTop:"4px", border:"none", borderRadius:"5px", padding:"7px 0", color:"#fff", fontSize:"10px", fontWeight:"700", letterSpacing:"1px", textTransform:"uppercase", cursor:"pointer", width:"100%", background:inB?"linear-gradient(135deg,#0a4a1a,#0d8a30)":"linear-gradient(135deg,#0d3a7a,#1a6fd4)"}}>
                        {inB ? "✓ In Basket" : "+ Add to Basket"}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* FAB basket */}
      <button onClick={()=>setDrawerOpen(true)} style={{position:"fixed", bottom:"24px", right:"24px", width:"60px", height:"60px", background:"linear-gradient(135deg,#0d3a7a,#1a6fd4)", border:"2px solid #2a7ae4", borderRadius:"50%", cursor:"pointer", boxShadow:"0 4px 20px rgba(26,111,212,0.55)", zIndex:900, display:"flex", alignItems:"center", justifyContent:"center", fontSize:"24px"}}>
        🛒
        {totalItems > 0 && <div style={{position:"absolute", top:"-4px", right:"-4px", background:c.green, color:"#fff", borderRadius:"50%", width:"20px", height:"20px", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"11px", fontWeight:"700"}}>{totalItems}</div>}
      </button>

      {/* FAB admin */}
      <button onClick={()=>setAdminOpen(true)} style={{position:"fixed", bottom:"24px", left:"24px", width:"60px", height:"60px", background:"#111820", border:"2px solid #1a3a6a", borderRadius:"50%", cursor:"pointer", zIndex:900, display:"flex", alignItems:"center", justifyContent:"center", fontSize:"22px"}}>⚙️</button>

      {/* Admin panel */}
      {adminOpen && (
        <div style={{position:"fixed", inset:0, zIndex:1000}}>
          <div onClick={()=>{setAdminOpen(false);setUnlocked(false);setPin("");}} style={{position:"absolute", inset:0, background:"rgba(0,0,0,0.7)"}} />
          <div style={{position:"absolute", top:0, left:0, bottom:0, width:"340px", background:"#0d1520", borderRight:"1px solid #1a3a6a", display:"flex", flexDirection:"column", boxShadow:"6px 0 30px rgba(0,0,0,0.7)"}}>
            <div style={{padding:"16px 20px", borderBottom:"1px solid #1a3a6a", background:"#0a0f18", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <span style={{color:c.blue, fontWeight:"700", fontSize:"13px", letterSpacing:"2px", textTransform:"uppercase"}}>⚙️ Stock Manager</span>
              <button onClick={()=>{setAdminOpen(false);setUnlocked(false);setPin("");}} style={{background:"none", border:"none", color:c.dim, fontSize:"22px", cursor:"pointer"}}>✕</button>
            </div>
            {!unlocked ? (
              <div style={{padding:"40px 24px", display:"flex", flexDirection:"column", alignItems:"center", gap:"16px"}}>
                <div style={{fontSize:"13px", color:c.muted, letterSpacing:"1px"}}>Enter PIN to manage stock</div>
                <input type="password" value={pin} onChange={e=>setPin(e.target.value)}
                  placeholder="PIN"
                  style={{width:"100%", background:"#0a0f18", border:"1px solid #1a3a6a", borderRadius:"6px", padding:"10px 14px", color:c.text, fontSize:"18px", letterSpacing:"6px", textAlign:"center", outline:"none", boxSizing:"border-box"}} />
                <button onClick={()=>{ if(pin===PIN) setUnlocked(true); else setPin(""); }}
                  style={{width:"100%", padding:"11px", background:"linear-gradient(135deg,#0d3a7a,#1a6fd4)", border:"none", borderRadius:"6px", color:"#fff", fontWeight:"700", fontSize:"13px", cursor:"pointer", letterSpacing:"2px"}}>
                  UNLOCK
                </button>
              </div>
            ) : (
              <div style={{flex:1, overflowY:"auto", padding:"12px 16px"}}>
                <div style={{fontSize:"11px", color:c.dim, letterSpacing:"1px", marginBottom:"12px", textTransform:"uppercase"}}>Tap to toggle availability</div>
                {CATEGORIES.map(cat => (
                  <div key={cat.id} style={{marginBottom:"20px"}}>
                    <div style={{fontSize:"10px", color:c.blue, letterSpacing:"2px", textTransform:"uppercase", marginBottom:"8px", fontWeight:"700"}}>{cat.icon} {cat.label}</div>
                    {PRODUCTS.filter(p=>p.category===cat.id).map(p => (
                      <div key={p.id} onClick={()=>setAvail(prev=>({...prev,[p.id]:prev[p.id]==="in_stock"?"order":"in_stock"}))}
                        style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"9px 12px", marginBottom:"6px", borderRadius:"6px", background:c.card, border:`1px solid ${avail[p.id]==="in_stock"?"rgba(0,180,100,0.3)":"rgba(255,160,0,0.3)"}`, cursor:"pointer"}}>
                        <span style={{fontSize:"12px", color:c.text, fontWeight:"600"}}>{p.name}</span>
                        <div style={{padding:"3px 10px", borderRadius:"3px", fontSize:"9px", fontWeight:"700", textTransform:"uppercase",
                          background:avail[p.id]==="in_stock"?"rgba(0,180,100,0.15)":"rgba(255,160,0,0.12)",
                          color:avail[p.id]==="in_stock"?c.green:c.amber,
                          border:avail[p.id]==="in_stock"?"1px solid rgba(0,180,100,0.3)":"1px solid rgba(255,160,0,0.3)"}}>
                          {avail[p.id]==="in_stock"?"In Stock":"To Order"}
                        </div>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Basket drawer */}
      {drawerOpen && (
        <div style={{position:"fixed", inset:0, zIndex:1000}}>
          <div onClick={()=>setDrawerOpen(false)} style={{position:"absolute", inset:0, background:"rgba(0,0,0,0.6)"}} />
          <div style={{position:"absolute", top:0, right:0, bottom:0, width:"340px", background:"#0d1520", borderLeft:"1px solid #1a3a6a", display:"flex", flexDirection:"column", boxShadow:"-6px 0 30px rgba(0,0,0,0.7)"}}>
            <div style={{padding:"16px 20px", borderBottom:"1px solid #1a3a6a", background:"#0a0f18", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <span style={{color:c.blue, fontWeight:"700", fontSize:"13px", letterSpacing:"2px", textTransform:"uppercase"}}>
                🛒 Basket{totalItems>0 && <span style={{background:c.blueDark, borderRadius:"10px", padding:"1px 8px", fontSize:"11px", marginLeft:"8px"}}>{totalItems}</span>}
              </span>
              <button onClick={()=>setDrawerOpen(false)} style={{background:"none", border:"none", color:c.dim, fontSize:"22px", cursor:"pointer"}}>✕</button>
            </div>
            <div style={{flex:1, overflowY:"auto", padding:"14px 16px"}}>
              {basket.length===0 ? (
                <div style={{textAlign:"center", color:"#3a5a7a", marginTop:"80px"}}>
                  <div style={{fontSize:"40px", marginBottom:"12px"}}>🛒</div>
                  <div style={{fontSize:"13px"}}>Your basket is empty</div>
                </div>
              ) : basket.map(item => (
                <div key={item.key} style={{background:c.card, border:"1px solid #1a2a3a", borderRadius:"8px", padding:"12px", marginBottom:"10px"}}>
                  <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
                    <div style={{flex:1}}>
                      <div style={{color:c.text, fontSize:"13px", fontWeight:"600", lineHeight:"1.3"}}>{item.name}</div>
                      <div style={{color:c.blue, fontSize:"11px", marginTop:"2px", fontWeight:"700"}}>{item.size}{!item.noVial?" / vial":""}</div>
                      <div style={{...availBadge(item.avail), marginTop:"5px"}}>{item.avail==="in_stock"?"✦ In Stock · 1–3 days":"⏱ To Order · Up to 14 days"}</div>
                    </div>
                    <button onClick={()=>removeItem(item.key)} style={{background:"none", border:"none", color:"#3a5a7a", fontSize:"18px", cursor:"pointer", paddingLeft:"8px"}}>✕</button>
                  </div>
                  <div style={{display:"flex", alignItems:"center", gap:"12px", marginTop:"10px"}}>
                    <button onClick={()=>updateQty(item.key,-1)} style={{width:"28px", height:"28px", background:"#1a2a3a", border:"1px solid #2a3a4a", borderRadius:"5px", color:c.muted, fontWeight:"700", fontSize:"16px", cursor:"pointer"}}>−</button>
                    <span style={{color:c.text, fontWeight:"700", fontSize:"14px", minWidth:"24px", textAlign:"center"}}>{item.qty}</span>
                    <button onClick={()=>updateQty(item.key,1)} style={{width:"28px", height:"28px", background:"#1a2a3a", border:"1px solid #2a3a4a", borderRadius:"5px", color:c.muted, fontWeight:"700", fontSize:"16px", cursor:"pointer"}}>+</button>
                  </div>
                </div>
              ))}
            </div>
            {basket.length>0 && (
              <div style={{padding:"16px", borderTop:"1px solid #1a3a6a", background:"#0a0f18"}}>
                <div style={{color:c.dim, fontSize:"11px", letterSpacing:"1px", marginBottom:"12px"}}>
                  TOTAL ITEMS: <span style={{color:c.blue, fontWeight:"700", fontSize:"14px"}}>{totalItems}</span>
                </div>
                <button onClick={sendWhatsApp} style={{width:"100%", padding:"13px", background:"linear-gradient(135deg,#075e54,#25d366)", border:"none", borderRadius:"7px", color:"#fff", fontWeight:"700", fontSize:"13px", letterSpacing:"2px", textTransform:"uppercase", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:"8px"}}>
                  <span style={{fontSize:"18px"}}>💬</span> Send via WhatsApp
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
